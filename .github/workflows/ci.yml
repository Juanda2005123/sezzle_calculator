name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Backend Unit & Integration Tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Check Statement Coverage Threshold
        run: |
          go tool cover -func=coverage.out
          TOTAL_COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total Statement Coverage: ${TOTAL_COVERAGE}%"

      - name: Build Backend Binary
        run: go build -v -ldflags="-s -w" -o ./bin/calculator-api ./cmd/api

  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suite with Coverage
        run: npm run test:coverage

      - name: Build Frontend Production Bundle
        run: npm run build

  docker-build:
    name: Docker Compose Build Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Docker Images
        run: docker compose build
