services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sezzle-calculator-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ALLOWED_ORIGINS=*
    healthcheck:
      test: ["CMD", "/bin/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sezzle-calculator-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
